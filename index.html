<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO - Modern Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="app-container">
    <header class="header">
      <h1>TODO</h1>
      <button class="theme-toggle" id="themeToggle" title="Switch theme">
        <span class="theme-icon">🌙</span>
      </button>
    </header>

    <div class="input-section">
      <div class="input-container">
        <input type="text" class="todo-input" placeholder="Create a new todo..." maxlength="200">
        <button class="add-btn" type="button">+</button>
      </div>
      <div class="reminder-controls">
        <input type="datetime-local" class="reminder-input" id="reminderInput">
        <button class="reminder-btn" id="reminderBtn" title="Add reminder">⏰</button>
      </div>
    </div>

    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <div class="todo-list" id="todoList">
      <div>No tasks yet. Add one above!</div>
    </div>

    <div class="stats" id="stats">
      0 tasks left
    </div>

    <div class="drag-hint">
      Drag and drop to reorder list
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
